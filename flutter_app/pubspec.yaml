name: couch_controller
publish_to: "none"
description: Secure widescreen four-motor couch controller prototype.
version: 0.2.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.3.3
  cryptography: ^2.7.0
  flutter_blue_plus: ^1.35.5
  flutter_libserialport: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
